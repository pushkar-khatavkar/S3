<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — CloudKida</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <nav class="nav">
          <a href="index.html" class="brand" aria-label="CloudKida home">
            <span class="logo-mark">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9.5a3.5 3.5 0 0 1 .5 6.98"

                <path d="M12 12v6m0 0-2-2m2 2 2-2" stroke="#04121a" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="brand-name">Cloud<span>Kida</span></span>
          </a>
          <a href="index.html" class="btn btn-ghost">Back to Home</a>
        </nav>
      </div>
    </header>

    <main class="error-wrap">
      <div>
        <div class="error-code">404</div>
        <h2>This lab wandered off</h2>
        <p>
          The page you're looking for doesn't exist or has moved. Let's get you back
          to the labs.
        </p>
        <a href="index.html" class="btn btn-primary">Back to Labs</a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          &copy; <span id="year"></span> CloudKida — cloudkida.com. All rights reserved.
        </div>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
