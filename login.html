<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CloudKida</title>
    <meta name="description" content="Sign in to your CloudKida account." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <nav class="nav">
          <a href="index.html" class="brand" aria-label="CloudKida home">
            <span class="logo-mark">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9.5a3.5 3.5 0 0 1 .5 6.98"
                  stroke="#04121a"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 12v6m0 0-2-2m2 2 2-2"
                  stroke="#04121a"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="brand-name">Cloud<span>Kida</span></span>
          </a>
          <a href="index.html" class="btn btn-ghost">Back to Home</a>
        </nav>
      </div>
    </header>

    <main class="auth-wrap">
      <div class="auth-card">
        <div class="brand">
          <span class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9.5a3.5 3.5 0 0 1 .5 6.98"
                stroke="#04121a"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 12v6m0 0-2-2m2 2 2-2"
                stroke="#04121a"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
        <h1>Welcome back, learner</h1>
        <p class="subtitle">Sign in to continue your labs on CloudKida</p>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@cloudkida.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="form-row">
            <label>
              <input type="checkbox" name="remember" />
              Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In &amp; Start Labs</button>
        </form>

        <p class="auth-footer">
          New to CloudKida? <a href="#">Create a free account</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          &copy; <span id="year"></span> CloudKida — cloudkida.com. All rights reserved.
        </div>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      // Demo-only handler: static sites cannot authenticate on their own.
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        alert("This is a demo static site hosted on AWS S3. Connect an auth backend (e.g. Amazon Cognito) to enable learner sign-in.");
      });
    </script>
  </body>
</html>
