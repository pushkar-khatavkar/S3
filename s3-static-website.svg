<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="CloudKida labs powered by AWS services: S3, EC2, Lambda, IAM, CloudFront and DevOps tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120" />
      <stop offset="1" stop-color="#16213e" />
    </linearGradient>
    <linearGradient id="ck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9900" />
      <stop offset="1" stop-color="#ec7211" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#02060f" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="720" height="460" rx="24" fill="url(#bg)" />
  <rect x="1" y="1" width="718" height="458" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" />

  <!-- Title -->
  <text x="40" y="58" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700">
    Cloud<tspan fill="#22d3ee">Kida</tspan> Labs
  </text>
  <text x="40" y="84" fill="#9aa8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
    Hands-on labs on AWS &amp; DevOps
  </text>
  <text x="680" y="58" text-anchor="end" fill="#ff9900" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">
    Powered by AWS
  </text>

  <!-- Connecting lines -->
  <g stroke="url(#ck)" stroke-width="2" opacity="0.35" fill="none">
    <path d="M360 250 L170 175" />
    <path d="M360 250 L360 150" />
    <path d="M360 250 L550 175" />
    <path d="M360 250 L170 340" />
    <path d="M360 250 L360 400" />
    <path d="M360 250 L550 340" />
  </g>

  <!-- Central cloud hub -->
  <g filter="url(#soft)">
    <circle cx="360" cy="250" r="46" fill="url(#ck)" />
    <g stroke="#04121a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(360 250)">
      <path d="M-16 8a8 8 0 0 1-1-16A11 11 0 0 1 16 -4a6.5 6.5 0 0 1 1 13" />
      <path d="M0 -2v14m0 0-5-5m5 5 5-5" />
    </g>
  </g>

  <!-- Service node helper style -->
  <!-- S3 -->
  <g filter="url(#soft)">
    <rect x="118" y="140" width="104" height="70" rx="14" fill="#16213e" stroke="url(#aws)" stroke-width="2" />
    <rect x="132" y="156" width="30" height="24" rx="4" fill="url(#aws)" />
    <text x="170" y="167" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">S3</text>
    <text x="132" y="200" fill="#9aa8c0" font-family="Segoe UI, sans-serif" font-size="11">Object Storage</text>
  </g>

  <!-- EC2 -->
  <g filter="url(#soft)">
    <rect x="308" y="104" width="104" height="70" rx="14" fill="#16213e" stroke="url(#aws)" stroke-width="2" />
    <rect x="322" y="120" width="30" height="24" rx="4" fill="url(#aws)" />
    <text x="360" y="131" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">EC2</text>
    <text x="322" y="164" fill="#9aa8c0" font-family="Segoe UI, sans-serif" font-size="11">Compute</text>
  </g>

  <!-- Lambda -->
  <g filter="url(#soft)">
    <rect x="498" y="140" width="104" height="70" rx="14" fill="#16213e" stroke="url(#aws)" stroke-width="2" />
    <rect x="512" y="156" width="30" height="24" rx="4" fill="url(#aws)" />
    <text x="550" y="167" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">λ</text>
    <text x="512" y="200" fill="#9aa8c0" font-family="Segoe UI, sans-serif" font-size="11">Lambda</text>
  </g>

  <!-- IAM -->
  <g filter="url(#soft)">
    <rect x="118" y="305" width="104" height="70" rx="14" fill="#16213e" stroke="url(#aws)" stroke-width="2" />
    <rect x="132" y="321" width="30" height="24" rx="4" fill="url(#aws)" />
    <text x="170" y="332" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">IAM</text>
    <text x="132" y="365" fill="#9aa8c0" font-family="Segoe UI, sans-serif" font-size="11">Security</text>
  </g>

  <!-- CloudFront -->
  <g filter="url(#soft)">
    <rect x="308" y="366" width="104" height="70" rx="14" fill="#16213e" stroke="url(#aws)" stroke-width="2" />
    <rect x="322" y="382" width="30" height="24" rx="4" fill="url(#aws)" />
    <text x="360" y="393" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">CF</text>
    <text x="322" y="426" fill="#9aa8c0" font-family="Segoe UI, sans-serif" font-size="11">CloudFront</text>
  </g>

  <!-- DevOps / Terraform -->
  <g filter="url(#soft)">
    <rect x="498" y="305" width="104" height="70" rx="14" fill="#16213e" stroke="url(#ck)" stroke-width="2" />
    <rect x="512" y="321" width="30" height="24" rx="4" fill="url(#ck)" />
    <text x="550" y="332" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">IaC</text>
    <text x="512" y="365" fill="#9aa8c0" font-family="Segoe UI, sans-serif" font-size="11">Terraform</text>
  </g>
</svg>
